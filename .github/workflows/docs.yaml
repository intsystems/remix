name: docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Install documentation dependencies
        run: python -m pip install "mkdocs>=1.6.0,<2" "mkdocs-material>=9.5.0" "mkdocstrings-python>=1.10.0"
      - name: Build documentation
        run: python -m mkdocs build --strict --config-file docs/mkdocs.yml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
